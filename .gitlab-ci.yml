stages:
  - build
  - deploy

# 
#  Agent 后端（TypeScript / Node.js）
# 
build-backend:
  stage: build
  only:
    - master
    - merge_requests
  script:
    - npm config set registry https://registry.npmmirror.com
    - npm install
    - npm run build
  cache:
    key: agent-backend-node
    paths:
      - node_modules/
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour

# 
#  Agent 前端（Vue3）
# 
build-frontend:
  stage: build
  only:
    - master
    - merge_requests
  script:
    - cd frontend
    - npm config set registry https://registry.npmmirror.com
    - npm install
    - chmod +x ./node_modules/.bin/vue-tsc ./node_modules/.bin/vite
    - ./node_modules/.bin/vue-tsc --noEmit
    - ./node_modules/.bin/vite build
  cache:
    key: agent-frontend-node
    paths:
      - frontend/node_modules/
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 hour

# 
#  部署（仅 master 分支触发，Runner 运行在部署服务器上，直接本地操作）
# 
deploy:
  stage: deploy
  only:
    - master
  needs:
    - build-backend
    - build-frontend
  script:
    - mkdir -p /var/www/citywalk /opt/citywalk
    - cp -r frontend/dist/* /var/www/citywalk/
    - cp -r dist /opt/citywalk/
    - cp package.json /opt/citywalk/
    - cd /opt/citywalk && npm install --production --registry https://registry.npmmirror.com
    - pkill -f 'node.*dist/server' || true
    - nohup node dist/server.js > /opt/citywalk/app.log 2>&1 &
    - echo "Agent 应用部署完成"
  environment:
    name: production
    url: http://106.14.66.114
  when: on_success